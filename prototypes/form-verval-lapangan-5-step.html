<style>

  .topbar { position: sticky; top: 0; z-index: 20; background: var(--green-600); color: #fff; display: flex; align-items: center; gap: 8px; padding: 12px; }

  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-bottom: 12px; }

  .kv { display: grid; grid-template-columns: 1fr; gap: 10px 12px; }

  .badge { display: inline-block; font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 999px; background: var(--green-50); color: var(--green-700); }

  .stepper { display: flex; align-items: center; gap: 4px; background: #fff; padding: 12px; border-bottom: 1px solid var(--border); overflow-x: auto; scrollbar-width: none; }

  .step.done { color: var(--green-700); } .step.done i { background: var(--green-700); color: #fff; }

  .btn { width: 100%; min-height: 46px; border-radius: 10px; border: 1.5px solid var(--green-700); background: var(--green-700); color: #fff; font-weight: 700; font-size: 14px; cursor: pointer; font-family: inherit; }
  .btn.sec { background: #fff; color: var(--green-700); }
  .btn:disabled { background: #E0E0E0; border-color: #E0E0E0; color: #8a8a8a; cursor: not-allowed; }

  /* form */
  .fld { width: 100%; height: 36px; border: 1px solid var(--border); border-radius: 8px; padding: 0 12px; font: inherit; font-size: 14px; background: #fff; }
  textarea.fld { height: 80px; padding: 10px; resize: vertical; }
  .fld[readonly], .fld:disabled { background: #F3F4F6; color: #555; cursor: not-allowed; }
  .fl { display: block; font-size: 13px; font-weight: 700; margin: 12px 0 4px; }
  .fg:first-child > .fl { margin-top: 0; }
  .hint { font-size: 11px; color: var(--muted); margin-top: 3px; }
  .rp { position: relative; } .rp b { position: absolute; left: 12px; top: 8px; font-size: 14px; color: var(--muted); } .rp .fld { padding-left: 38px; }
  .inl { display: flex; gap: 8px; align-items: center; } .inl .unit { font-size: 12px; color: var(--muted); white-space: nowrap; min-width: 48px; }
  .emsg { display: none; color: var(--red); font-size: 12px; margin-top: 4px; }
  .has-err > .emsg { display: block; }
  .has-err > .fld, .has-err > .inl .fld, .has-err > .rp .fld { border-color: var(--red); }
  .has-err > .tog button, .has-err > .rad { border-color: var(--red); }
  .counter { font-size: 11px; color: var(--muted); margin-top: 4px; }
  .callout { background: #F9FBFC; border: 1px solid #EFF1F3; border-radius: 8px; padding: 8px 10px; font-size: 12px; color: #374151; margin-bottom: 12px; line-height: 1.45; }
  .callout.green { background: var(--green-50); border-color: #BFE5CF; color: var(--green-700); }
  .callout.amber { background: var(--amber-50); border-color: #F5D58A; color: var(--amber); }
  .okbanner { background: var(--green-50); border: 1px solid #BFE5CF; color: var(--green-700); font-size: 12px; font-weight: 700; border-radius: 8px; padding: 8px 10px; margin-bottom: 12px; }
  .rad { display: flex; gap: 8px; border: 1px solid transparent; border-radius: 8px; }
  .rad label { flex: 1; border: 1.5px solid var(--border); border-radius: 10px; min-height: 44px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; cursor: pointer; background: #fff; }
  .rad label.on { background: var(--green-50); border-color: var(--green-600); color: var(--green-700); }

  /* foto */
  .banner { background: var(--amber-50); border-left: 4px solid var(--amber-500); padding: 8px 10px; border-radius: 6px; font-size: 12px; color: var(--amber); margin-bottom: 12px; }
  .slot { display: grid; grid-template-columns: 88px 1fr; gap: 12px; align-items: center; }
  .slot .pic { width: 88px; height: 88px; border: 2px dashed #C5CAD3; border-radius: 10px; display: grid; place-items: center; color: #9AA1AD; font-size: 24px; cursor: pointer; background-size: cover; background-position: center; position: relative; }
  .slot .pic.has { border-style: solid; border-color: var(--green-600); color: transparent; }
  .slot.has-err .pic { border-color: var(--red); }
  .slot .pic small { position: absolute; bottom: 4px; font-size: 10px; color: var(--muted); }
  .slot .pic.has small { display: none; }
  .slot h4 { margin: 0; font-size: 13px; }
  .slot p { margin: 2px 0 6px; font-size: 12px; color: var(--muted); }
  .slot .acts { display: flex; gap: 6px; flex-wrap: wrap; }
  .link { background: none; border: 0; color: var(--green-700); font-weight: 700; font-size: 12px; padding: 8px 0; cursor: pointer; min-height: 36px; font-family: inherit; }
  .link.red { color: var(--red); }
  .progress-line { font-size: 12px; font-weight: 700; margin: 0 0 10px; }
  .perr { color: var(--red); font-size: 12px; margin-top: 4px; }

  /* indikator + skor */
  .cat { font-size: 12px; font-weight: 800; letter-spacing: .04em; color: var(--green-700); margin: 14px 0 0; padding: 6px 10px; background: var(--green-50); border-radius: 6px; text-transform: uppercase; }
  .subcat { font-size: 11px; font-weight: 800; color: var(--muted); margin: 10px 0 0; text-transform: uppercase; letter-spacing: .04em; }
  .ind { padding: 12px 0; border-top: 1px solid #F0F1F4; }
  .cat + .ind, .subcat + .ind { border-top: 0; }
  .ind .top { display: flex; gap: 8px; margin-bottom: 8px; }
  .ind .no { width: 24px; height: 24px; flex: none; border-radius: 6px; background: #EEE; display: grid; place-items: center; font-size: 12px; font-weight: 700; }
  .ind h4 { margin: 0; font-size: 13px; }
  .opts { display: grid; gap: 6px; border: 1px solid transparent; border-radius: 10px; }
  .has-err > .opts { border-color: var(--red); padding: 4px; }
  .opt { display: grid; grid-template-columns: 18px 1fr auto; gap: 8px; align-items: start; border: 1.5px solid var(--border); border-radius: 10px; padding: 10px; font-size: 12px; line-height: 1.4; cursor: pointer; background: #fff; }
  .opt .dot { width: 16px; height: 16px; border-radius: 50%; border: 2px solid #BDBDBD; margin-top: 1px; }
  .opt .sc { font-size: 11px; font-weight: 800; color: var(--muted); white-space: nowrap; }
  .opt.on.s1 { background: var(--green-50); border-color: var(--green-600); } .opt.on.s1 .dot { border-color: var(--green-600); background: radial-gradient(var(--green-600) 45%, transparent 50%); }
  .opt.on.s3 { background: var(--amber-50); border-color: var(--amber-500); } .opt.on.s3 .dot { border-color: var(--amber-500); background: radial-gradient(var(--amber-500) 45%, transparent 50%); }
  .opt.on.s5 { background: var(--red-50); border-color: var(--red); } .opt.on.s5 .dot { border-color: var(--red); background: radial-gradient(var(--red) 45%, transparent 50%); }
  .opt.on .sc { color: var(--text); }
  .sub { margin-top: 8px; }
  .sub textarea { width: 100%; border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font: inherit; font-size: 13px; resize: vertical; min-height: 56px; }
  .has-err > textarea { border-color: var(--red); }

  /* swadaya */
  .mrow { padding: 12px 0; border-top: 1px solid #F0F1F4; }
  .grp + .mrow, .mrow:first-of-type { border-top: 0; }
  .mrow .mh b { font-size: 13px; display: block; } .mrow .mh small { font-size: 11px; color: var(--muted); }
  .tog { display: flex; gap: 8px; margin: 8px 0 0; }
  .tog button { flex: 1; min-height: 40px; border-radius: 10px; border: 1.5px solid var(--border); background: #fff; font-weight: 700; font-size: 13px; cursor: pointer; font-family: inherit; }
  .tog button.on.y { background: var(--green-50); border-color: var(--green-600); color: var(--green-700); }
  .tog button.on.n { background: #F3F4F6; border-color: #9AA1AD; color: #374151; }
  .mini { display: flex; gap: 10px; align-items: center; }
  .mini .th { width: 56px; height: 56px; border-radius: 8px; background: #ddd center/cover; flex: none; border: 1px solid var(--green-600); }
  .mini .addph { border: 1.5px dashed #C5CAD3; border-radius: 10px; min-height: 40px; padding: 0 12px; background: #fff; color: var(--green-700); font-weight: 700; font-size: 12px; cursor: pointer; font-family: inherit; }
  .has-err > .mini .addph { border-color: var(--red); }
  .mgrid { display: grid; grid-template-columns: 1fr; gap: 8px 10px; align-items: center; margin-top: 8px; }
  .mgrid > * { grid-column: 1; }
  .mgrid .sub { margin-top: 0; }
  .mgrid .slot { grid-column: 1 / -1; grid-template-columns: 72px 1fr; }
  .mgrid .slot .pic { width: 72px; height: 72px; }
  .total { border-radius: 12px; background: #0C6B3D; color: #fff; padding: 14px; margin-bottom: 12px; }
  .total small { opacity: .85; font-size: 11px; } .total b { display: block; font-size: 24px; margin: 2px 0 6px; }
  .total .chip { display: inline-block; font-size: 11px; font-weight: 700; border-radius: 999px; padding: 3px 8px; background: rgba(255,255,255,.2); }

  /* langkah 5 */
  .res { display: grid; gap: 6px; font-size: 12px; }
  .res .r { display: flex; justify-content: space-between; gap: 10px; padding: 5px 0; border-bottom: 1px solid #F0F1F4; }
  .res .r:last-child { border: 0; } .res .r span { color: var(--muted); } .res .r b { text-align: right; }
  .res .bad { color: #C62828; } .res .ok { color: var(--green-700); }
  .score { display: flex; align-items: baseline; gap: 6px; margin: 4px 0 8px; } .score b { font-size: 28px; } .score span { color: var(--muted); font-size: 13px; }
  .rc { border: 1.5px solid var(--border); border-radius: 12px; padding: 12px; margin-bottom: 10px; background: #fff; }
  .rc .hd { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; }
  .rc .hd .dot { width: 18px; height: 18px; border-radius: 50%; border: 2px solid #BDBDBD; flex: none; margin-top: 2px; }
  .rc .hd b { font-size: 14px; display: block; } .rc .hd small { font-size: 12px; color: var(--muted); }
  .rc.on { border-color: var(--green-600); background: #FBFEFC; } .rc.on .hd .dot { border-color: var(--green-600); background: radial-gradient(var(--green-600) 45%, transparent 50%); }
  .rc.on.tolak { border-color: var(--red); } .rc.on.tolak .hd .dot { border-color: var(--red); background: radial-gradient(var(--red) 45%, transparent 50%); }
  .rc .body2 { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--border); }
  .chk, .rop { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; padding: 8px 0; cursor: pointer; }
  .chk input, .rop input { margin-top: 2px; width: 18px; height: 18px; flex: none; }
  .rop { border: 1.5px solid var(--border); border-radius: 10px; padding: 10px; margin-bottom: 6px; }
  .rop.on { border-color: var(--green-600); background: var(--green-50); }
  .pakta { background: #E8F0FE; border-radius: 10px; padding: 12px; font-size: 13px; font-style: italic; line-height: 1.5; margin-bottom: 12px; }
  .pakta small { display: block; font-style: normal; color: var(--muted); font-size: 11px; margin-top: 6px; }
  .sig { margin-bottom: 14px; }
  .sig h4 { margin: 0 0 2px; font-size: 13px; } .sig .who { font-size: 11px; color: var(--muted); margin-bottom: 6px; }
  .sig canvas { width: 100%; height: 150px; display: block; border: 1.5px dashed #9AA1AD; border-radius: 10px; background: #fff; touch-action: none; cursor: crosshair; }
  .has-err > canvas { border-color: var(--red); }
  .sig.wait .box { height: 70px; border: 1.5px dashed #C5CAD3; border-radius: 10px; display: grid; place-items: center; color: var(--muted); font-size: 12px; background: #F9FAFB; }
  .doc2 { display: grid; gap: 8px; }
  .doc2 button { min-height: 40px; border-radius: 10px; border: 1.5px solid var(--border); background: #F3F4F6; color: #8a8a8a; font-weight: 700; font-size: 12px; font-family: inherit; }

  /* dialog */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.75); display: none; align-items: center; justify-content: center; z-index: 50; padding: 16px; }
  .overlay.show { display: flex; }
  .dlg { background: #fff; border-radius: 8px; width: 100%; max-width: 430px; overflow: hidden; }
  .dlg .hd { padding: 8px 24px; } .dlg .hd h1 { margin: 12px 0 0; font: 700 21px Roboto, Lato, sans-serif; color: #008444; }
  .dlg .bd { padding: 24px; font-size: 14px; color: #424242; }
  .dlg .bd.info { display: flex; align-items: center; gap: 12px; padding: 16px 24px 40px; }
  .dlg .ft { background: #FAFAFA; padding: 16px 24px; display: flex; justify-content: flex-end; gap: 16px; }
  .dlg .ft.center { justify-content: center; }
  .dlg .ft button { min-height: 38px; padding: 9px 16px; border-radius: 8px; font: 700 14px Lato, Roboto, sans-serif; cursor: pointer; border: 1.5px solid #069550; background: #069550; color: #fff; }
  .dlg .ft button.sec { background: #fff; color: #008444; border-color: #008444; }
</style>
</head>

<script>
/* ===== data ===== */
const STEPS = ['Data Diri', 'Foto (9)', 'Penilaian', 'Swadaya', 'Kesimpulan'];

// skor 1 = ada/cukup, 3 = sebagian, 5 = tidak ada (konfirmasi 2026-11-02). Indikator 10 hanya 1 / 5.

const IND = [
  { g: 'I. Keselamatan Bangunan', sg: 'A. Komponen Struktural', no: 1, t: 'Pondasi Rumah', o: STR },
  { sg: '', no: 2, t: 'Sloof', o: STR },
  { no: 3, t: 'Tiang / Kolom Penyangga', o: STR },
  { no: 4, t: 'Balok Pengikat', o: STR },

    ['Luas rumah dibagi jumlah penghuni, kurang dari 7,2 m²', 5]] },
  { no: 11, t: 'Pencahayaan Alami (Min. 10% Luas Lantai)', o: [

function validate(step) {

    DOCS.forEach((_, i) => { if (!S.photos['d' + i]) e['d' + i] = PHOTO; });
  } else if (step === 2) {
    PHOTOS.forEach((_, i) => { if (!S.photos['p' + i]) e['p' + i] = PHOTO; });
  } else if (step === 3) {
    IND.forEach(({ no }) => {
      if (!S.ans[no]) e['i' + no] = PICK;
      else if (S.ans[no] > 1 && !String(S.note[no] || '').trim()) e['n' + no] = 'Keterangan wajib diisi untuk skor ' + S.ans[no] + '.';
    });
  } else if (step === 4) {
    [...MAT_LAMA, ...MAT_BARU].forEach(([k]) => {
      const m = S.mat[k] || {};
      if (!m.a) e['r_' + k] = PICK;

    });

      if (!m.a) e['r_' + k] = PICK;
      else if (m.a === 'y') { if (!num(m.v)) e['v_' + k] = 'Nilai wajib diisi.'; if (other && !String(m.nm || '').trim()) e['nm_' + k] = 'Nama sumber wajib diisi.'; }
    });

      const m = S.tk[k] || {};
      if (!m.a) e['r_' + k] = PICK;
      else if (m.a === 'y') {
        if (other && !String(m.nm || '').trim()) e['nm_' + k] = 'Nama sumber wajib diisi.';
        if (!String(m.k || '').trim()) e['k_' + k] = 'Nama / keterangan relawan wajib diisi.';
        if (!num(m.j)) e['j_' + k] = 'Jumlah orang wajib diisi.';

    });

    if (!S.d1.trim()) e.d1 = REQ;
    if (!S.d2.trim()) e.d2 = REQ;
    if (!S.rek) e.rek = 'Pilih salah satu rekomendasi.';

}

  <div class="hint" style="margin-bottom:12px">Konsolidasi data verval, evaluasi kelayakan usulan, catatan lapangan, dan penandatanganan Berita Acara.</div>
  <div class="card"><h3>Bagian A — Resume Legalitas CPB <span class="badge" style="float:right">Memenuhi</span></h3><div class="res">
    ${r('Nama Penerima', esc(f.nama))}${r('NIK', MASK_NIK)}${r('Status Lahan', `${esc(f.lahan)}${f.lahanNo ? ` (${esc(f.lahanNo)})` : ''}`, 'ok')}
    ${r('Kategori Hunian', esc(f.kategori))}${r('Rumah Satu-satunya', f.satu === 'y' ? 'Ya' : 'Tidak', f.satu === 'y' ? 'ok' : 'bad')}
    ${r('Kelengkapan Dokumen', DOCS.map((d, i) => `${S.photos['d' + i] ? '✓' : '✕'} ${d[0]}`).join('<br>'))}</div></div>
  <div class="card"><h3>Bagian B — Resume Fisik &amp; Kerusakan <span class="badge ${sc.bad ? 'red' : 'warn'}" style="float:right">${sc.label} · draft</span></h3>
    <div class="score"><b>${sc.total}</b><span>dari 65 (skor 1/3/5 × 13 indikator)</span></div>
    <div class="res">${sc.kel.map((k) => r(`${k.nm} (${k.s}/${k.mx})`, k.bad.length ? esc(k.bad.join(', ')) : 'Tidak ada masalah', k.bad.length ? 'bad' : 'ok')).join('')}</div>
    <div class="hint" style="margin-top:8px">Kategori dan ambang skor hanya contoh; ambang resmi serta redaksi final menunggu PO (P1, P2).</div></div>
  <div class="card"><h3>Bagian C — Resume Swadaya Warga</h3><div class="res">
    ${r('Finansial Kas CPB', rp(kas), kas >= MIN_SWADAYA ? 'ok' : 'bad')}${r('Syarat Min. Swadaya (contoh)', kas >= MIN_SWADAYA ? 'Terpenuhi' : 'Belum terpenuhi', kas >= MIN_SWADAYA ? 'ok' : 'bad')}
    ${r('Material Bekas Layak', matL.length ? `${matL.length} item (${esc(matL.join(', '))})` : 'Tidak ada')}${r('Material Baru Tersedia', matB.length ? `${matB.length} item (${esc(matB.join(', '))})` : 'Tidak ada')}
    ${r('Dukungan Gotong Royong', tkOn.length ? `${orang} orang (${esc(tkOn.map(([k, t, , o]) => (o ? S.tk[k].nm : t)).join(', '))})` : 'Tidak ada')}
    ${r('Estimasi nilai material', 'Menunggu aturan PO (P3)')}</div></div>
  <div class="card"><h3>Bagian D — Catatan Penilaian Teknis Fasilitator Lapangan</h3>
    ${fg('d1', 'Catatan Evaluasi Teknis &amp; Prioritas Rekomendasi', `<textarea class="fld" style="height:96px" maxlength="${MAXC}" oninput="setD('d1',this.value)">${esc(S.d1)}</textarea><div class="counter" id="c_d1">Tersisa ${MAXC - S.d1.length} karakter</div>`)}
    ${fg('d2', 'Akses Pengiriman Material &amp; Kondisi Lingkungan', `<textarea class="fld" style="height:96px" maxlength="${MAXC}" oninput="setD('d2',this.value)">${esc(S.d2)}</textarea><div class="counter" id="c_d2">Tersisa ${MAXC - S.d2.length} karakter</div>`)}
    <div class="callout green" style="margin:12px 0 0">Fasilitator Lapangan bertanggung jawab atas kebenaran faktual hasil survei dan validasi data teknis ini.</div></div>
  <div class="card" data-k="rek"><h3>Bagian E — Kesimpulan Rekomendasi Lapangan ${RQ}</h3><div class="hint" style="margin:-4px 0 10px">Pertimbangan teknis kelayakan penetapan SK Penerima Bantuan Sosial.</div>`;
  const rc = (key, cls, title, sub, body) => `<div class="rc ${cls} ${S.rek === key ? 'on' : ''}"><div class="hd" onclick="setRek('${key}')"><span class="dot"></span><div><b>${title}</b><small>${sub}</small></div></div>${S.rek === key ? `<div class="body2">${body}</div>` : ''}</div>`;
  h += rc('lolos', '', 'Lolos Verval Lapangan', 'CPB memenuhi seluruh parameter kelaikan fisik bangunan, legalitas kepemilikan tanah, kriteria sosial ekonomi, dan kesiapan swadaya aktif.',
    fg('skema', 'Pilih Skema Konstruksi yang Dianjurkan', ['Konvensional (Struktur Beton Bertulang)|Pondasi batu kali, kolom praktis 15×15 cm, dinding batako/bata diplester, rangka atap ringan/kayu lokal.', 'Ferosemen (Tembok Tanpa Struktur Kolom)|Perkuatan anyaman wiremesh berlapis spesi mortar semen pasir, hemat biaya &amp; fleksibel tanah labil.'].map((o) => { const [t, d] = o.split('|'); const v = t.split(' ')[0]; return `<div class="rop ${S.skema === v ? 'on' : ''}" onclick="setSk('${v}')"><input type="radio" ${S.skema === v ? 'checked' : ''}><div><b>${t}</b><div class="hint">${d}</div></div></div>`; }).join('')));
  h += rc('dialih', '', 'Dialihkan ke Program Lainnya', 'Kebutuhan tidak sesuai Program Nominatif. Kondisi rumah atau usulan lebih tepat diakomodasi melalui skema program penanganan perumahan lain.',
    fg('prog', 'Rekomendasi Alihan Program', PROG.map((p) => `<div class="rop ${S.prog === p ? 'on' : ''}" onclick="setPg(${PROG.indexOf(p)})"><input type="radio" ${S.prog === p ? 'checked' : ''}><div>${p}</div></div>`).join('')) +
    fg('justif', 'Catatan Justifikasi Pengalihan', `<textarea class="fld" style="height:80px" maxlength="${MAXC}" placeholder="Tuliskan argumen atau dasar pengalihan program..." oninput="setJ(this.value)">${esc(S.justif)}</textarea>`));
  h += rc('tolak', 'tolak', 'Ditolak / Tidak Direkomendasikan', 'Terdapat klausul ketidaksesuaian kriteria dasar Pergub Jabar atau CPB tidak memenuhi persyaratan kelayakan penerima bantuan.',
    fg('alasan', 'Pilih Alasan Pembatalan / Gugur', ALASAN.map((a, i) => `<label class="chk"><input type="checkbox" ${S.alasan[i] ? 'checked' : ''} onchange="setAl(${i},this.checked)"><span>${a}</span></label>`).join('')));
  h += `<div class="emsg" style="margin-top:0"></div></div>`;
  h += `<div class="card"><h3>Bagian F — Pernyataan CPB &amp; Berita Acara</h3>`;
  if (S.rek !== 'lolos') h += `<div class="callout">Hanya berlaku untuk rekomendasi <b>Lolos Verval Lapangan</b>. ${S.rek ? 'Tidak diperlukan untuk rekomendasi yang dipilih.' : 'Pilih rekomendasi pada Bagian E.'}</div>`;
  else h += `<div class="pakta">“Calon Penerima Bantuan (CPB) sanggup mengikuti ketentuan program, melaksanakan pekerjaan renovasi secara gotong royong sesuai petunjuk teknis, memelihara hasil renovasi, dan tidak akan memindahtangankan atau mengundurkan diri.”<small>Peraturan Gubernur Jawa Barat No. 34 Tahun 2021</small></div>
    <div class="sig wait"><h4>Diperiksa oleh: Koordinator Fasilitator Kab.</h4><div class="who">Dinas Perumahan dan Kawasan Permukiman</div><div class="box">Menunggu — dilengkapi di luar form ini</div></div>
    <div class="sig" data-k="cpb"><h4>Diketahui oleh: Calon Penerima Bantuan (CPB) ${RQ}</h4><div class="who">${esc(f.nama)} · paraf / tanda tangan di layar</div><canvas id="sig_cpb"></canvas><button class="link red" onclick="sigClear('cpb')">Hapus</button><div class="emsg"></div></div>
    <div class="sig" data-k="tpm"><h4>Dilakukan oleh: Tenaga Pendamping Masyarakat (TPM) ${RQ}</h4><div class="who">Fasilitator Lapangan Kecamatan</div><canvas id="sig_tpm"></canvas><button class="link red" onclick="sigClear('tpm')">Hapus</button><div class="emsg"></div></div>
    <div class="callout" style="margin-bottom:8px">Berita Acara Verval No: akan diterbitkan sistem (menyusul)</div>
    <div class="doc2"><button disabled>Cetak Form Blangko Fisik — menyusul</button><button disabled>Unduh PDF Berita Acara — menyusul</button></div>`;
  return h + '</div>';
}

/* ===== handlers ===== */
function setF(k, v) { S.f[k] = v; touch(); }
function setR(k, v) { S.f[k] = v; rerender(); }
function setAns(no, sc) { S.ans[no] = sc; rerender(); }
function setNote(no, v) { S.note[no] = v; touch(); }
function setAda(grp, k, a) { S[grp][k] = Object.assign({}, S[grp][k], { a }); rerender(); }
function setSub(grp, k, f, v) { S[grp][k][f] = v; touch(); }
function setD(k, v) { S[k] = v; const c = $('c_' + k); if (c) c.textContent = `Tersisa ${MAXC - v.length} karakter`; touch(); }
function setRek(v) { S.rek = v; rerender(); }
function setSk(v) { S.skema = v; rerender(); }
function setPg(i) { S.prog = PROG[i]; rerender(); }
function setJ(v) { S.justif = v; touch(); }
function setAl(i, c) { S.alasan[i] = c; touch(); }
function fmtRp(el) { el.value = el.value.replace(/\D/g, '').replace(/\B(?=(\d{3})+(?!\d))/g, '.'); }

/* foto */
function pick(k) { pickKey = k; $('fileIn').click(); }
$('fileIn').addEventListener('change', (e) => {
  const f = e.target.files[0]; e.target.value = ''; if (!f || pickKey === null) return;
  const k = pickKey;
  if (!/^image\/(jpeg|png)$/.test(f.type)) { S.perr[k] = 'Format harus .jpg/.jpeg/.png'; return rerender(); }
  if (f.size > MAX_MB * 1048576) { S.perr[k] = `Ukuran file lebih dari ${MAX_MB} MB`; return rerender(); }
  delete S.perr[k]; if (S.photos[k]) URL.revokeObjectURL(S.photos[k].url);
  S.photos[k] = { url: URL.createObjectURL(f), name: f.name, size: (f.size / 1048576).toFixed(2) }; rerender();
});
function delPhoto(k) { if (S.photos[k].url.startsWith('blob:')) URL.revokeObjectURL(S.photos[k].url); delete S.photos[k]; rerender(); }

/* tanda tangan — Pointer Events (touch + mouse), latar putih supaya terbaca saat dicetak */
function sigDraw(id) {
  const c = $('sig_' + id); if (!c) return;
  const r = c.getBoundingClientRect(), dpr = window.devicePixelRatio || 1, w = Math.round(r.width), h = Math.round(r.height);
  if (!w) return;
  if (c.width !== w * dpr || c.height !== h * dpr) { c.width = w * dpr; c.height = h * dpr; }
  const x = c.getContext('2d'); x.setTransform(dpr, 0, 0, dpr, 0, 0);
  x.fillStyle = '#fff'; x.fillRect(0, 0, w, h); x.strokeStyle = '#111'; x.lineWidth = 2.2; x.lineCap = 'round'; x.lineJoin = 'round';
  SIG[id].forEach((s) => { x.beginPath(); s.forEach(([px, py], i) => (i ? x.lineTo(px * w, py * h) : x.moveTo(px * w, py * h))); if (s.length === 1) x.lineTo(s[0][0] * w + 0.1, s[0][1] * h); x.stroke(); });
}
function sigBind(id) {
  const c = $('sig_' + id); if (!c) return; let cur = null;
  const pt = (e) => { const r = c.getBoundingClientRect(); return [(e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height]; };
  c.addEventListener('pointerdown', (e) => { e.preventDefault(); c.setPointerCapture(e.pointerId); cur = [pt(e)]; SIG[id].push(cur); sigDraw(id); });
  c.addEventListener('pointermove', (e) => { if (!cur) return; cur.push(pt(e)); sigDraw(id); });
  ['pointerup', 'pointercancel'].forEach((ev) => c.addEventListener(ev, () => { if (cur) { cur = null; touch(); } }));
}
function sigClear(id) { SIG[id] = []; sigDraw(id); touch(); }
window.addEventListener('resize', () => ['cpb', 'tpm'].forEach(sigDraw));

/* ===== render + flow ===== */
function render() {
  const f = S.f;
  $('stepper').innerHTML = STEPS.map((s, i) => { const n = i + 1, cls = n === S.step ? 'active' : n < S.step ? 'done' : ''; return `<div class="step ${cls}"><i>${n < S.step ? '✓' : n}</i><span>${s}</span></div>${n < STEPS.length ? '<span class="sep">›</span>' : ''}`; }).join('');
  const act = document.querySelector('.step.active'); if (act) $('stepper').scrollLeft = act.offsetLeft - 40;
  $('pane').innerHTML = [pane1, pane2, pane3, pane4, pane5][S.step - 1]();
  $('btnBack').style.display = S.step === 1 ? 'none' : '';
  $('btnNext').textContent = S.step < 5 ? 'Lanjutkan' : S.rek === 'tolak' ? 'Simpan & Proses Penolakan' : S.rek === 'dialih' ? 'Simpan & Proses Pengalihan' : 'Selesaikan & Kirim Verval';
  if (S.step === 4) updTot();
  if (S.step === 5) ['cpb', 'tpm'].forEach((id) => { sigBind(id); sigDraw(id); });
  if (S.show) paintErrors();
}
function rerender() { const y = window.scrollY; render(); window.scrollTo(0, y); }
function goStep(n) { S.step = n; S.show = false; render(); window.scrollTo(0, 0); }
function next() {
  // validasi wajib-isi sengaja tidak memblokir (sama seperti baseline 2026-10-14); validate() disimpan buat implementasi nyata
  if (S.step < 5) goStep(S.step + 1);
  else { if (!S.rek) S.rek = 'lolos'; const c = { lolos: ['Kirim Hasil Verval?', 'Setelah dikirim, usulan berstatus Lolos Verval Lapangan dan data tidak bisa diubah.'], dialih: ['Proses Pengalihan?', 'Usulan akan berstatus Dialihkan ke program yang dipilih. Data tidak bisa diubah.'], tolak: ['Proses Penolakan?', 'Usulan akan berstatus Ditolak dan diteruskan ke arsip penolakan. Data tidak bisa diubah.'] }[S.rek]; $('cfTitle').textContent = c[0]; $('cfMsg').textContent = c[1]; $('confirm').classList.add('show'); }
}
function prev() { if (S.step > 1) goStep(S.step - 1); }
function closeConfirm() { $('confirm').classList.remove('show'); }
let infoReset = false;
function showInfo(title, msg, btn, sub = '', resetAfter = false) { $('inTitle').textContent = title; $('inMsg').textContent = msg; $('inSub').textContent = sub; $('inBtn').textContent = btn; infoReset = resetAfter; $('info').classList.add('show'); }
function closeInfo() { $('info').classList.remove('show'); if (infoReset) resetAll(); }
function submitForm() {
  closeConfirm();
  const ok = { lolos: 'Usulan berhasil dinyatakan lolos verifikasi lapangan.', dialih: 'Usulan berhasil dialihkan pada verifikasi lapangan.', tolak: 'Usulan berhasil ditolak pada verifikasi lapangan.' }[S.rek];
  console.log('payload (mock):', JSON.stringify({ rek: S.rek, skor: scores().total, f: S.f, ans: S.ans, note: S.note, mat: S.mat, uang: S.uang, tk: S.tk, d1: S.d1, d2: S.d2, ...(S.rek === 'lolos' && { skema: S.skema }), ...(S.rek === 'dialih' && { prog: S.prog, justif: S.justif }), ...(S.rek === 'tolak' && { alasan: Object.keys(S.alasan).filter((i) => S.alasan[i]).map((i) => ALASAN[i]) }), ttd: { cpb: SIG.cpb.length, tpm: SIG.tpm.length } }));
  showInfo('Berhasil', ok + ' (mock — belum terhubung API)', S.rek === 'lolos' ? 'Kembali ke Penugasan' : 'Kembali ke Detail Usulan', 'IMA-2026-001234', true);
}
function resetAll() { Object.values(S.photos).forEach((p) => p.url.startsWith('blob:') && URL.revokeObjectURL(p.url)); S = blank(); SIG.cpb = []; SIG.tpm = []; render(); window.scrollTo(0, 0); }

/* isi contoh — hanya untuk demo / uji validasi */
function fillDemo() {
  const ph = (t, c) => { const cv = document.createElement('canvas'); cv.width = cv.height = 160; const x = cv.getContext('2d'); x.fillStyle = c; x.fillRect(0, 0, 160, 160); x.fillStyle = '#fff'; x.font = '14px sans-serif'; x.fillText(t, 10, 84); return { url: cv.toDataURL('image/jpeg', .6), name: t + '.jpg', size: '0.01' }; };
  Object.assign(S.f, { kategori: KATEGORI[0], lama: '12', satu: 'y', lahan: LAHAN[0], lahanNo: 'AJB No. 42/2011' });
  DOCS.forEach((d, i) => (S.photos['d' + i] = ph('dokumen ' + (i + 1), '#6B7280'))); PHOTOS.forEach((p, i) => (S.photos['p' + i] = ph(p[0], '#8B6B4A')));
  IND.forEach((d) => { const sc = [1, 3, 5][d.no % 3]; S.ans[d.no] = d.o.some(([, s]) => s === sc) ? sc : 5; if (S.ans[d.no] > 1) S.note[d.no] = 'Contoh keterangan kondisi lapangan.'; });
  [...MAT_LAMA, ...MAT_BARU].forEach(([k], i) => { if (i % 3 === 2) S.mat[k] = { a: 'n' }; else { S.mat[k] = { a: 'y', q: String(5 + i) }; S.photos['f_' + k] = ph('material', '#7A8B4A'); } });
  S.uang = { u0: { a: 'y', v: '2.500.000' }, u1: { a: 'n' }, u2: { a: 'y', v: '1.500.000' }, u3: { a: 'n' } };
  S.tk = { t0: { a: 'y', k: 'CPB dan 1 mandor tukang lokal', j: '2' }, t1: { a: 'y', k: 'Saudara kandung', j: '2' }, t2: { a: 'y', k: 'Kelompok ronda RT 04', j: '5' }, t3: { a: 'n' } };
  S.d1 = 'Prioritas penanganan pada pondasi dan rangka atap yang rawan runtuh.'; S.d2 = 'Akses jalan semen selebar 1,8 meter, material dibawa dengan pikap kecil.';
  S.rek = 'lolos'; S.skema = 'Konvensional';
  const line = [[0.1, 0.65], [0.25, 0.3], [0.4, 0.7], [0.55, 0.35], [0.8, 0.6]]; SIG.cpb = [line]; SIG.tpm = [line.map(([x, y]) => [x, 1 - y])];
  rerender();
}
render();
</script>
