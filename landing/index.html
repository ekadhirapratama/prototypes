<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prototypes</title>
<style>
  :root { --bg:#fafafa; --fg:#111; --muted:#666; --card:#fff; --line:#e5e5e5; --accent:#2563eb; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111; --fg:#eee; --muted:#999; --card:#1a1a1a; --line:#2a2a2a; --accent:#60a5fa; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui,sans-serif; }
  main { max-width:720px; margin:0 auto; padding:32px 16px; }
  h1 { margin:0 0 24px; font-size:24px; }
  a.card { display:block; padding:16px; margin-bottom:12px; background:var(--card); border:1px solid var(--line); border-radius:8px; color:inherit; text-decoration:none; }
  a.card:hover { border-color:var(--accent); }
  .t { font-weight:600; }
  .d { color:var(--muted); margin:4px 0; }
  .m { color:var(--muted); font-size:13px; }
  .tag { display:inline-block; margin-left:6px; padding:0 8px; border:1px solid var(--line); border-radius:999px; }
</style>
</head>
<body>
<main>
  <h1>Prototypes</h1>
  <div id="list">Memuat…</div>
</main>
<script>
const list = document.getElementById('list');
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));

fetch('./manifest.json')
  .then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then((items) => {
    if (!items.length) { list.textContent = 'Belum ada prototype.'; return; }
    list.innerHTML = items.map((p) => `
      <a class="card" href="./${encodeURIComponent(p.slug)}.html">
        <div class="t">${esc(p.title)}</div>
        ${p.desc ? `<div class="d">${esc(p.desc)}</div>` : ''}
        <div class="m">${esc(p.date)}${p.tags.map((t) => `<span class="tag">${esc(t)}</span>`).join('')}</div>
      </a>`).join('');
  })
  .catch(() => { list.textContent = 'Gagal memuat daftar prototype.'; });
</script>
</body>
</html>
